name: Android Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  CAPACITOR_VERSION: '8'

jobs:
  build-release:
    name: Build Nur Quran APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare Capacitor dependencies
        working-directory: ..
        run: |
          npm init -y
          npm install --no-save @capacitor/android@${CAPACITOR_VERSION} @capacitor/app@${CAPACITOR_VERSION} @capacitor/share@${CAPACITOR_VERSION} @capacitor/status-bar@${CAPACITOR_VERSION} @capacitor/toast@${CAPACITOR_VERSION}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          set -euo pipefail
          mkdir -p release-assets
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          cp "$APK" "release-assets/nur-quran-${TAG}.apk"
          ls -lh release-assets/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nur-quran-android-${{ github.event.release.tag_name || github.ref_name }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release-assets/*.apk --clobber
